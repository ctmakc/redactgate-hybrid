<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
  <title id="t">Pass-through hatch</title>
  <desc id="d">Cutaway of a clean-room pass box in a wall. On the left, the device room holds the original document with private details marked. In the wall, the hatch with two interlocked doors and a lamp over each. On the right, the cloud room receives a copy where every private detail is a token.</desc>
  <style>
    .ink{stroke:#111518;stroke-width:2;fill:none;stroke-linejoin:round}
    .thin{stroke:#111518;stroke-width:1;fill:none}
    .hair{stroke:#8E989C;stroke-width:1;fill:none}
    .panel{fill:#EEF1F1}
    .steel{fill:#C3CBCE}
    .steel2{fill:#AEB8BC}
    .dark{fill:#111518}
    .go{fill:#137A43}
    .stop{fill:#C8321F}
    .cob{fill:#2A4FC2}
    .line{fill:#5B666B}
    .lab{font:700 13px Oxanium, 'Arial Narrow', sans-serif;letter-spacing:.08em;fill:#111518}
    .tok{font:400 10px 'Fragment Mono', ui-monospace, monospace;fill:#EEF1F1}
    .mark{fill:#137A43;opacity:.22}
    .doorL{animation:doorL 6s steps(6) infinite}
    .doorR{animation:doorR 6s steps(6) infinite}
    .lampL{animation:lampL 6s step-end infinite}
    .lampR{animation:lampR 6s step-end infinite}
    .pass{animation:pass 6s steps(12) infinite}
    @keyframes doorL{0%,8%{transform:translateY(0)}18%,92%{transform:translateY(-118px)}100%{transform:translateY(0)}}
    @keyframes doorR{0%,44%{transform:translateY(-118px)}54%,82%{transform:translateY(0)}92%,100%{transform:translateY(-118px)}}
    @keyframes lampL{0%{fill:#C8321F}18%{fill:#137A43}44%{fill:#C8321F}100%{fill:#C8321F}}
    @keyframes lampR{0%{fill:#C8321F}54%{fill:#137A43}82%{fill:#C8321F}100%{fill:#C8321F}}
    @keyframes pass{0%,22%{transform:translateX(0);opacity:0}26%{opacity:1}40%{transform:translateX(0)}56%,80%{transform:translateX(150px);opacity:1}86%,100%{transform:translateX(150px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.doorL,.doorR,.lampL,.lampR,.pass{animation:none}.doorR{transform:translateY(-118px)}.lampR{fill:#137A43}.pass{opacity:1;transform:translateX(150px)}}
  </style>

  <!-- floor and rooms -->
  <rect x="0" y="0" width="720" height="440" fill="#D6DCDE"/>
  <rect x="0" y="0" width="300" height="440" class="panel"/>
  <rect x="420" y="0" width="300" height="440" fill="#E3E8F4"/>
  <path class="hair" d="M0 392H300M420 392H720"/>
  <g class="hair">
    <path d="M0 60H300M0 160H300M0 260H300M100 0V392M200 0V392"/>
    <path d="M420 60H720M420 160H720M420 260H720M520 0V392M620 0V392"/>
  </g>

  <!-- wall section -->
  <rect x="300" y="0" width="120" height="440" class="steel"/>
  <g class="thin" opacity=".55">
    <path d="M300 30l20 -20M300 70l60 -60M300 110l100 -100M310 140l110 -110M330 160l90 -90M300 200l120 -120M300 240l120 -120"/>
    <path d="M300 330l120 -120M300 370l120 -120M310 400l110 -110M340 410l80 -80M300 440l120 -120M360 440l60 -60"/>
  </g>
  <!-- hatch cavity -->
  <rect x="300" y="150" width="120" height="130" fill="#F7F9F9"/>
  <path class="ink" d="M300 150H420M300 280H420"/>
  <rect x="300" y="276" width="120" height="8" class="steel2"/>
  <!-- door tracks -->
  <rect x="298" y="20" width="8" height="262" class="steel2"/>
  <rect x="414" y="20" width="8" height="262" class="steel2"/>

  <!-- doors (slide up) -->
  <g class="doorL"><rect x="296" y="150" width="12" height="130" class="dark"/><rect x="299" y="200" width="6" height="30" fill="#5B666B"/></g>
  <g class="doorR" style="transform:translateY(-118px)"><rect x="412" y="150" width="12" height="130" class="dark"/><rect x="415" y="200" width="6" height="30" fill="#5B666B"/></g>

  <!-- lamps -->
  <rect x="276" y="112" width="28" height="18" rx="3" class="dark"/>
  <circle cx="290" cy="121" r="6" class="lampL stop"/>
  <rect x="416" y="112" width="28" height="18" rx="3" class="dark"/>
  <circle cx="430" cy="121" r="6" class="lampR stop"/>

  <!-- tokens crossing the hatch -->
  <g class="pass">
    <rect x="312" y="196" width="78" height="16" rx="2" class="cob"/><text x="318" y="208" class="tok">PERSON_1</text>
    <rect x="312" y="218" width="64" height="16" rx="2" class="cob"/><text x="318" y="230" class="tok">SIN_1</text>
  </g>

  <!-- device-side document -->
  <g transform="translate(46 96) rotate(-3)">
    <rect x="6" y="6" width="196" height="250" fill="#AEB8BC"/>
    <rect width="196" height="250" fill="#FBFCFC"/><rect width="196" height="250" class="ink"/>
    <rect x="16" y="18" width="70" height="7" class="line"/>
    <rect x="16" y="40" width="40" height="6" class="line"/><rect x="58" y="37" width="76" height="12" class="mark"/><rect x="60" y="40" width="72" height="6" class="line"/>
    <rect x="16" y="56" width="150" height="6" class="line"/>
    <rect x="16" y="70" width="60" height="6" class="line"/><rect x="78" y="67" width="88" height="12" class="mark"/><rect x="80" y="70" width="84" height="6" class="line"/>
    <rect x="16" y="84" width="164" height="6" class="line"/>
    <rect x="16" y="98" width="120" height="6" class="line"/>
    <rect x="16" y="112" width="30" height="6" class="line"/><rect x="48" y="109" width="98" height="12" class="mark"/><rect x="50" y="112" width="94" height="6" class="line"/>
    <rect x="16" y="126" width="158" height="6" class="line"/>
    <rect x="16" y="140" width="96" height="6" class="line"/>
    <rect x="16" y="160" width="70" height="6" class="line"/><rect x="88" y="157" width="70" height="12" class="mark"/><rect x="90" y="160" width="66" height="6" class="line"/>
    <rect x="16" y="174" width="146" height="6" class="line"/>
    <rect x="16" y="188" width="164" height="6" class="line"/>
    <rect x="16" y="214" width="56" height="6" class="line"/><rect x="74" y="211" width="62" height="12" class="mark"/><rect x="76" y="214" width="58" height="6" class="line"/>
  </g>

  <!-- cloud-side copy -->
  <g transform="translate(486 104) rotate(2)">
    <rect x="6" y="6" width="190" height="236" fill="#9FB0D9"/>
    <rect width="190" height="236" fill="#FBFCFC"/><rect width="190" height="236" class="ink"/>
    <rect x="16" y="18" width="70" height="7" class="line"/>
    <rect x="16" y="40" width="40" height="6" class="line"/><rect x="58" y="36" width="64" height="14" rx="2" class="cob"/><text x="62" y="47" class="tok">PERSON_1</text>
    <rect x="16" y="58" width="150" height="6" class="line"/>
    <rect x="16" y="72" width="60" height="6" class="line"/><rect x="78" y="68" width="44" height="14" rx="2" class="cob"/><text x="82" y="79" class="tok">SIN_1</text>
    <rect x="16" y="90" width="158" height="6" class="line"/>
    <rect x="16" y="104" width="120" height="6" class="line"/>
    <rect x="16" y="118" width="30" height="6" class="line"/><rect x="48" y="114" width="70" height="14" rx="2" class="cob"/><text x="52" y="125" class="tok">ADDRESS_1</text>
    <rect x="16" y="136" width="150" height="6" class="line"/>
    <rect x="16" y="156" width="70" height="6" class="line"/><rect x="88" y="152" width="58" height="14" rx="2" class="cob"/><text x="92" y="163" class="tok">PHONE_1</text>
    <rect x="16" y="174" width="140" height="6" class="line"/>
    <rect x="16" y="200" width="56" height="6" class="line"/><rect x="74" y="196" width="58" height="14" rx="2" class="cob"/><text x="78" y="207" class="tok">EMAIL_1</text>
  </g>

  <!-- placards -->
  <rect x="20" y="20" width="132" height="28" class="dark"/><text x="32" y="39" class="lab" style="fill:#EEF1F1">THIS DEVICE</text>
  <rect x="568" y="20" width="132" height="28" class="cob"/><text x="590" y="39" class="lab" style="fill:#EEF1F1">THE CLOUD</text>
  <rect x="314" y="300" width="92" height="40" fill="#F2C230"/>
  <rect x="314" y="300" width="92" height="40" class="ink"/>
  <text x="323" y="317" class="lab" style="font-size:10px">INTERLOCK</text>
  <text x="323" y="332" class="lab" style="font-size:10px">ONE DOOR</text>
</svg>
